# Мінімальний alembic.ini: усе, що згенерував `alembic init`, але без
# закоментованих опцій. Повний файл з поясненнями кожного ключа -- у
# документації Alembic.

[alembic]
# Де лежать міграції. %(here)s -- тека цього ini-файла, тому запускати alembic
# можна з будь-якого місця (з -c), шлях не поїде.
script_location = %(here)s/migrations

# Додається до sys.path перед запуском env.py. Саме завдяки цьому рядку
# env.py може написати `from models import Base` -- інакше тека alembic_ex
# в sys.path не потрапляє й імпорт падає.
prepend_sys_path = .

path_separator = os

# Порожньо навмисно. Адресу бази підставляє env.py з db.DB_URL, щоб вона була
# записана один раз. Тримати її тут теж можна -- але тоді код і міграції
# ходять у різні бази, щойно хтось змінить одне й забуде інше.
# У реальному проєкті сюди (або в env.py) підставляють os.environ["DATABASE_URL"],
# бо в ini-файл, який лежить у git, паролі не пишуть.
sqlalchemy.url =


# Логування. Постав level = INFO у logger_sqlalchemy, щоб бачити SQL, який
# виконують міграції.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
