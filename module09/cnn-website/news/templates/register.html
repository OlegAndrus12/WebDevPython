{% extends "base.html" %}

{% block title %}Register · CNN Reader{% endblock %}

{% block content %}
<div class="auth-form mx-auto">
    <h1 class="h3 mb-4">Create an account</h1>

    <div id="auth-error" class="alert alert-danger d-none" role="alert"></div>

    {# id="register-form" -- auth.js intercepts submit and POSTs JSON to
       /api/auth/register. #}
    <form id="register-form" novalidate>
        <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" type="text" id="username" name="username"
                   autocomplete="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email"
                   autocomplete="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password"
                   autocomplete="new-password" required minlength="8">
        </div>
        <button class="btn btn-accent w-100" type="submit">Create account</button>
    </form>

    <p class="mt-3 small">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
