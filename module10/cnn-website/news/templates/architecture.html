<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNN Reader Architecture · CNN Reader</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #eceef1;
    --surface: #ffffff;
    --surface-2: #f4f6f8;
    --sunken: #e6e9ed;
    --ink: #161b22;
    --ink-soft: #4d5665;
    --muted: #77818e;
    --line: #d2d7de;
    --wire: #a7b0bb;
    --accent: #c81e1e;
    --accent-soft: #fceceb;
    --flow-sync: #c81e1e;
    --flow-async: #1f6f8b;
    --flow-async-soft: #e5f0f5;
    --shadow: 0 1px 2px rgba(22, 27, 34, .06), 0 10px 30px -20px rgba(22, 27, 34, .35);
    --display: "IBM Plex Sans Condensed", "Helvetica Neue", Arial, sans-serif;
    --body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #10141a;
      --surface: #171d25;
      --surface-2: #1d242e;
      --sunken: #131820;
      --ink: #e6e9ee;
      --ink-soft: #a8b2bf;
      --muted: #7c8693;
      --line: #2a323d;
      --wire: #3f4a58;
      --accent: #ff6060;
      --accent-soft: #2b1719;
      --flow-sync: #ff6060;
      --flow-async: #4fb6d6;
      --flow-async-soft: #10262f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px -20px rgba(0, 0, 0, .9);
    }
  }

  :root[data-theme="dark"] {
    --ground: #10141a;
    --surface: #171d25;
    --surface-2: #1d242e;
    --sunken: #131820;
    --ink: #e6e9ee;
    --ink-soft: #a8b2bf;
    --muted: #7c8693;
    --line: #2a323d;
    --wire: #3f4a58;
    --accent: #ff6060;
    --accent-soft: #2b1719;
    --flow-sync: #ff6060;
    --flow-async: #4fb6d6;
    --flow-async-soft: #10262f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px -20px rgba(0, 0, 0, .9);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding-block: 32px 56px;
    padding-inline: 20px;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1480px; margin: 0 auto; }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 18px 32px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 16px;
    margin-bottom: 22px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }

  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(1.9rem, 5vw, 2.7rem);
    line-height: 1;
    letter-spacing: -.02em;
    margin: 0;
  }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 20px; }
  .legend div { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); }
  .legend i { width: 24px; height: 0; border-top-width: 2px; border-top-style: solid; flex: none; }
  .legend .s { border-color: var(--flow-sync); }
  .legend .a { border-color: var(--flow-async); border-top-style: dashed; }
  .legend .o { border-color: var(--wire); border-top-style: dotted; }

  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 364px; gap: 24px; align-items: start; }

  @media (max-width: 1080px) {
    .cols { grid-template-columns: minmax(0, 1fr); }
    .panel-col { order: -1; }
  }

  .board {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px;
    overflow-x: auto;
    box-shadow: var(--shadow);
  }

  svg.diagram { display: block; width: 100%; min-width: 1080px; height: auto; }

  /* group frames */
  .grp { fill: var(--sunken); stroke: var(--line); stroke-width: 1.5; }
  .grp-t { font-family: var(--body); font-size: 12.5px; font-weight: 600; fill: var(--ink-soft); }
  .tier { font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em; fill: var(--muted); text-transform: uppercase; }
  .frame { fill: none; stroke: var(--wire); stroke-width: 1.5; stroke-dasharray: 7 5; }
  .note { font-family: var(--mono); font-size: 9.5px; fill: var(--muted); }

  /* nodes */
  .node { cursor: pointer; }
  .node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.4; transition: fill .15s, stroke .15s; }
  /* a frame is itself the .node, so it keeps its sunken fill and only its stroke reacts */
  rect.grp.node { cursor: pointer; transition: stroke .15s; }
  rect.grp.node:hover, rect.grp.node.sel { stroke: var(--accent); stroke-width: 2.4; }
  rect.grp.node:focus-visible { outline: none; stroke: var(--accent); stroke-width: 2.4; }
  .node .nm { font-family: var(--body); font-size: 12px; font-weight: 600; fill: var(--ink); }
  .node .sub { font-family: var(--mono); font-size: 9.5px; fill: var(--muted); }
  .node:hover rect { fill: var(--accent-soft); stroke: var(--accent); }
  .node:focus-visible { outline: none; }
  .node:focus-visible rect { stroke: var(--accent); stroke-width: 2.4; }
  .node.sel rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.4; }
  .node.optional rect { stroke-dasharray: 5 4; }
  .vol rect { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .vol text { font-family: var(--mono); font-size: 9.5px; fill: var(--muted); }

  /* both shapes carry .svc: a node's child rect, and a group frame rect itself.
     Only stroke animates, so a frame keeps its sunken fill. */
  .svc.flash rect, rect.svc.flash { animation: flash 1.1s ease-out both; }
  @keyframes flash {
    0%, 100% { stroke: var(--line); stroke-width: 1.4; }
    26%, 58% { stroke: var(--accent); stroke-width: 2.8; }
  }
  @media (prefers-reduced-motion: reduce) {
    .svc.flash rect, rect.svc.flash { animation: none; stroke: var(--accent); stroke-width: 2.8; }
  }

  /* wires */
  .wire { fill: none; stroke-width: 1.6; }
  .wire.sync { stroke: var(--flow-sync); }
  .wire.async { stroke: var(--flow-async); stroke-dasharray: 6 4; }
  .wire.obs { stroke: var(--wire); stroke-dasharray: 2 4; }
  .elabel { font-family: var(--mono); font-size: 9.5px; fill: var(--ink-soft); }
  #ar-sync path { fill: var(--flow-sync); }
  #ar-async path { fill: var(--flow-async); }
  #ar-obs path { fill: var(--wire); }

  /* panel */
  .panel-col { position: sticky; top: 20px; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    max-height: calc(100vh - 48px);
    overflow-y: auto;
  }

  @media (max-width: 1080px) {
    .panel-col { position: static; }
    .panel { max-height: none; }
  }

  .panel-top { padding: 16px 18px 13px; border-bottom: 1px solid var(--line); }

  .kind {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 4px;
    background: var(--accent-soft);
    color: var(--accent);
  }

  .kind.async { background: var(--flow-async-soft); color: var(--flow-async); }

  .panel-top h3 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.3rem;
    margin: 9px 0 0;
    letter-spacing: -.01em;
  }

  .panel section { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .panel section:last-child { border-bottom: 0; }

  .panel h4 {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 9px;
    font-weight: 500;
  }

  .panel ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .panel ul li { font-size: 13px; line-height: 1.45; padding-left: 14px; position: relative; }
  .panel ul li::before { content: ""; position: absolute; left: 0; top: .5em; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  code { font-family: var(--mono); font-size: .88em; background: var(--surface-2); padding: 1px 4px; border-radius: 3px; }

  dl { margin: 0; display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 6px 12px; align-items: baseline; }
  dt { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  dd { margin: 0; font-family: var(--mono); font-size: 11px; word-break: break-word; }

  .files { display: flex; flex-direction: column; gap: 4px; }
  .files code { background: none; padding: 0; font-size: 11px; color: var(--ink-soft); }

  pre {
    margin: 0;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.7;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 11px;
    overflow-x: auto;
    color: var(--ink-soft);
  }

  footer { margin-top: 22px; color: var(--muted); font-size: 11.5px; font-family: var(--mono); }

  /* ---- served-page additions (the Artifact host supplied these) ---- */
  [hidden] { display: none !important; }
  img { max-width: 100%; }

  .gate { min-height: 72vh; display: grid; place-items: center; padding: 40px 20px; }

  .gate-card {
    max-width: 470px;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 34px 30px;
    box-shadow: var(--shadow);
  }

  .gate-card h2 { font-family: var(--display); font-weight: 700; font-size: 1.75rem; margin: 6px 0 10px; letter-spacing: -.01em; }
  .gate-card p { color: var(--ink-soft); margin: 0 0 20px; font-size: 14px; }

  .gate-link {
    display: inline-block;
    font-family: var(--body);
    font-size: 13px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 9px 20px;
    border-radius: 6px;
  }

  .gate-link:hover { filter: brightness(1.08); }
  .gate-link.ghost { background: none; color: var(--ink-soft); border: 1px solid var(--line); }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    text-decoration: none;
    margin-bottom: 12px;
  }

  .back:hover { color: var(--accent); }
</style>
</head>
<body>

<div class="gate" id="gate">
    <div class="gate-card">
        <p class="eyebrow">restricted</p>
        <h2>Admins only</h2>
        <p id="gate-msg">Checking your account&hellip;</p>
        <a class="gate-link ghost" id="gate-action" href="/login" hidden>Sign in</a>
    </div>
</div>

<div id="doc" hidden>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">module 09 · cnn-website · head 31dd488df6fe</p>
      <h1>CNN Reader Architecture</h1>
    </div>
    <div class="legend">
      <div><i class="s"></i> a request is waiting</div>
      <div><i class="a"></i> scheduled work</div>
      <div><i class="o"></i> observes only</div>
    </div>
  </header>

  <div class="cols">
    <div class="board">
      <svg class="diagram" viewBox="0 0 1360 880" role="img"
           aria-label="The full cnn8-jwt stack: browser and NewsAPI outside, and inside Docker Compose the api container with its middleware, routers and modules, the worker and beat containers with their two tasks, Postgres with four tables, Redis with three databases, Mailpit with three emails, pgAdmin, Flower and four named volumes.">
        <defs>
          <marker id="ar-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M0,1 L9,5 L0,9 z"></path>
          </marker>
          <marker id="ar-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M0,1 L9,5 L0,9 z"></path>
          </marker>
          <marker id="ar-obs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M0,1 L9,5 L0,9 z"></path>
          </marker>
        </defs>

        <!-- compose frame -->
        <rect class="frame" x="24" y="100" width="1312" height="740" rx="10"></rect>

        <!-- ============ WIRES (under nodes) ============ -->
        <!-- request path -->
        <path class="wire sync" d="M150,80 V188" marker-end="url(#ar-sync)"></path>
        <text class="elabel" x="158" y="132">bearer token</text>

        <path class="wire sync" d="M150,230 V258" marker-end="url(#ar-sync)"></path>
        <path class="wire sync" d="M150,300 V330" marker-end="url(#ar-sync)"></path>

        <path class="wire sync" d="M245,374 V440" marker-end="url(#ar-sync)"></path>
        <text class="elabel" x="252" y="416">session</text>

        <path class="wire sync" d="M371,374 V424 H660 V440" marker-end="url(#ar-sync)"></path>
        <text class="elabel" x="470" y="419">verification</text>

        <path class="wire sync" d="M497,374 V410 H1000 V440" marker-end="url(#ar-sync)"></path>
        <text class="elabel" x="700" y="405">article:{id} · rl:{ip}</text>

        <path class="wire sync" d="M686,352 H706 V120 H1150 V80" marker-end="url(#ar-sync)"></path>
        <text class="elabel" x="880" y="114">1 request per page load</text>

        <!-- scheduled path -->
        <path class="wire async" d="M895,300 V440" marker-end="url(#ar-async)"></path>
        <text class="elabel" x="902" y="336">enqueue</text>

        <path class="wire async" d="M1179,440 V300" marker-end="url(#ar-async)"></path>
        <text class="elabel" x="1186" y="336">consume</text>

        <path class="wire async" d="M744,230 V430 H240 V440" marker-end="url(#ar-async)"></path>
        <text class="elabel" x="330" y="425">upsert · recipients</text>

        <path class="wire async" d="M752,230 V418 H820 V440" marker-end="url(#ar-async)"></path>
        <text class="elabel" x="760" y="413">2 emails</text>

        <path class="wire async" d="M1296,188 V120 H1250 V80" marker-end="url(#ar-async)"></path>
        <text class="elabel" x="1206" y="146">headlines</text>

        <!-- observers -->
        <path class="wire obs" d="M244,690 V644" marker-end="url(#ar-obs)"></path>
        <path class="wire obs" d="M1096,690 V644" marker-end="url(#ar-obs)"></path>

        <!-- ============ OUTSIDE ============ -->
        <g class="node" data-node="browser" tabindex="0" role="button" aria-label="Browser">
          <rect x="40" y="20" width="220" height="60" rx="8"></rect>
          <text class="nm" x="56" y="46">browser</text>
          <text class="sub" x="56" y="65">localStorage · auth.js</text>
        </g>
        <g class="node" data-node="newsapi" tabindex="0" role="button" aria-label="NewsAPI, external">
          <rect x="1100" y="20" width="220" height="60" rx="8"></rect>
          <text class="nm" x="1116" y="46">newsapi.org</text>
          <text class="sub" x="1116" y="65">external · 100 req/day</text>
        </g>

        <g class="node" data-node="compose" tabindex="0" role="button" aria-label="Docker Compose project">
          <rect x="40" y="84" width="286" height="32" rx="6"></rect>
          <text class="nm" x="56" y="105">docker compose</text>
          <text class="sub" x="196" y="105">name: cnn8-jwt</text>
        </g>

        <!-- ============ API CONTAINER ============ -->
        <rect class="grp svc node" x="48" y="136" width="652" height="264" rx="9" data-node="api" tabindex="0" role="button" aria-label="api container"></rect>
        <text class="grp-t" x="64" y="160">api · uvicorn :8010 → 8000</text>

        <text class="tier" x="64" y="181">middleware</text>
        <g class="node" data-node="rate_limit" tabindex="0" role="button" aria-label="Rate limit middleware">
          <rect x="60" y="188" width="290" height="42" rx="7"></rect>
          <text class="nm" x="74" y="206">rate_limit</text>
          <text class="sub" x="74" y="222">60 / 60s per IP · outermost</text>
        </g>
        <g class="node optional" data-node="toolbar" tabindex="0" role="button" aria-label="Debug toolbar middleware">
          <rect x="366" y="188" width="320" height="42" rx="7"></rect>
          <text class="nm" x="380" y="206">debug toolbar</text>
          <text class="sub" x="380" y="222">DEBUG=true only · inner</text>
        </g>

        <text class="tier" x="64" y="251">routers</text>
        <g class="node" data-node="r_pages" tabindex="0" role="button" aria-label="Pages router">
          <rect x="60" y="258" width="146" height="42" rx="7"></rect>
          <text class="nm" x="74" y="276">pages</text>
          <text class="sub" x="74" y="292">HTML · 6</text>
        </g>
        <g class="node" data-node="r_api" tabindex="0" role="button" aria-label="Articles router">
          <rect x="214" y="258" width="146" height="42" rx="7"></rect>
          <text class="nm" x="228" y="276">api</text>
          <text class="sub" x="228" y="292">articles · stats</text>
        </g>
        <g class="node" data-node="r_auth" tabindex="0" role="button" aria-label="Auth router">
          <rect x="368" y="258" width="146" height="42" rx="7"></rect>
          <text class="nm" x="382" y="276">auth</text>
          <text class="sub" x="382" y="292">register · login</text>
        </g>
        <g class="node" data-node="r_newsletter" tabindex="0" role="button" aria-label="Newsletter router">
          <rect x="522" y="258" width="164" height="42" rx="7"></rect>
          <text class="nm" x="536" y="276">newsletter</text>
          <text class="sub" x="536" y="292">PUT subscription</text>
        </g>

        <text class="tier" x="64" y="323">modules</text>
        <g class="node" data-node="security" tabindex="0" role="button" aria-label="Security module">
          <rect x="60" y="330" width="118" height="44" rx="7"></rect>
          <text class="nm" x="72" y="349">security</text>
          <text class="sub" x="72" y="365">JWT · roles</text>
        </g>
        <g class="node" data-node="repository" tabindex="0" role="button" aria-label="Repository module">
          <rect x="186" y="330" width="118" height="44" rx="7"></rect>
          <text class="nm" x="198" y="349">repository</text>
          <text class="sub" x="198" y="365">every query</text>
        </g>
        <g class="node" data-node="mail" tabindex="0" role="button" aria-label="Mail module">
          <rect x="312" y="330" width="118" height="44" rx="7"></rect>
          <text class="nm" x="324" y="349">mail</text>
          <text class="sub" x="324" y="365">FastMail</text>
        </g>
        <g class="node" data-node="cache" tabindex="0" role="button" aria-label="Cache module">
          <rect x="438" y="330" width="118" height="44" rx="7"></rect>
          <text class="nm" x="450" y="349">cache</text>
          <text class="sub" x="450" y="365">cache-aside</text>
        </g>
        <g class="node" data-node="news_api" tabindex="0" role="button" aria-label="NewsAPI client module">
          <rect x="564" y="330" width="122" height="44" rx="7"></rect>
          <text class="nm" x="576" y="349">news_api</text>
          <text class="sub" x="576" y="365">httpx per call</text>
        </g>

        <!-- ============ WORKER CONTAINERS ============ -->
        <rect class="grp" x="724" y="136" width="588" height="264" rx="9"></rect>
        <text class="grp-t" x="740" y="160">worker · beat — the second process type</text>

        <text class="tier" x="740" y="181">tasks</text>
        <g class="node" data-node="t_newsletter" tabindex="0" role="button" aria-label="send_newsletter task">
          <rect x="760" y="188" width="250" height="42" rx="7"></rect>
          <text class="nm" x="774" y="206">send_newsletter</text>
          <text class="sub" x="774" y="222">08:00 · confirmed + subscribed</text>
        </g>
        <g class="node" data-node="t_stats" tabindex="0" role="button" aria-label="send_stats_report task">
          <rect x="1026" y="188" width="270" height="42" rx="7"></rect>
          <text class="nm" x="1040" y="206">send_stats_report</text>
          <text class="sub" x="1040" y="222">07:00 · confirmed admins</text>
        </g>

        <text class="tier" x="740" y="251">processes</text>
        <g class="node svc" data-node="beat" tabindex="0" role="button" aria-label="Celery beat">
          <rect x="760" y="258" width="250" height="42" rx="7"></rect>
          <text class="nm" x="774" y="276">beat</text>
          <text class="sub" x="774" y="292">2 crontabs · 1 replica</text>
        </g>
        <g class="node svc" data-node="worker" tabindex="0" role="button" aria-label="Celery worker">
          <rect x="1026" y="258" width="270" height="42" rx="7"></rect>
          <text class="nm" x="1040" y="276">worker</text>
          <text class="sub" x="1040" y="292">prefork ×2 · asyncio.run</text>
        </g>

<script>
  const N = {
    compose: ["orchestration", "docker compose", [

    browser: ["client", "browser", [

      ["news/news_api.py"], []],

      "<code>/api/*</code> only: a healthcheck that can be rate-limited into failing is a liability.",
      "Fails open on <code>RedisError</code> and <code>RuntimeError</code>."
    ], [
      ["RATE_LIMIT_REQUESTS", "60"], ["RATE_LIMIT_WINDOW_SECONDS", "60"],
      ["key", "rl:{ip}:{epoch // window}"], ["over", "429 + Retry-After"]

    toolbar: ["middleware", "debug toolbar", [

      ["news/debug.py", "news/middleware.py"],
      ["echo 'DEBUG=true' >> .env", "docker compose restart api"]],

    r_pages: ["router", "pages", [

    ], [["prefix", "/"], ["routes", "6"], ["response", "HTMLResponse"]],
      ["news/routers/pages.py", "news/templates/"], []],

    r_api: ["router", "api", [
      "Articles list and detail, like/unlike, liked list, and stats.",

    ], [["prefix", "/api"], ["auth", "bearer on all but nothing"], ["per_page", "1–100"]],
      ["news/routers/api.py"],
      ["curl -s \"$BASE/api/articles?per_page=2\" -H \"Authorization: Bearer $TOKEN\""]],

    r_auth: ["router", "auth", [

      ["news/routers/auth.py"], ["curl -s -X POST \"$BASE/api/auth/login\" -d 'username=…&password=…'"]],

    r_newsletter: ["router", "newsletter", [
      "One route, one method: <code>PUT /api/me/subscription</code> with <code>{\"subscribed\": bool}</code>.",

      ["news/routers/newsletter.py"],
      ["curl -s -X PUT \"$BASE/api/me/subscription\" -H \"Authorization: Bearer $TOKEN\" \\\n  -H 'Content-Type: application/json' -d '{\"subscribed\":true}'"]],

    security: ["module", "security", [
      "Two token scopes from one key: <code>access_token</code> and <code>verification_token</code>. Without the scope check the signup link would be a bearer token.",

    news_api: ["module", "news_api", [

      ["news/news_api.py"], []],

    worker: ["service", "worker", [

      ["pool", "prefork"], ["prefetch", "1"], ["time limits", "60 soft / 90 hard"], ["serializer", "json"]
    ], ["news/celery_app.py", "news/tasks.py"],
      ["docker compose exec worker celery -A news.celery_app inspect registered", "docker compose logs -f worker"]],

    beat: ["service", "beat", [
      "Schedules and runs nothing. A stack with beat and no worker queues jobs forever.",

      "<code>crontab</code>, not an interval: an interval is measured from the last run and drifts from the clock on every restart."
    ], [
      ["newsletter", "crontab 0 8 * * * UTC"], ["stats report", "crontab 0 7 * * * UTC"],
      ["--schedule", "/var/lib/celery/beat-schedule"]
    ], ["news/celery_app.py"], ["docker compose logs -f beat"]],

    t_newsletter: ["task", "send_newsletter", [
      "One task, three steps: fetch headlines, upsert them, mail every confirmed <em>and</em> subscribed reader.",

    ], [["schedule", "08:00 UTC"], ["NEWSLETTER_MAX_ARTICLES", "10"], ["returns", "{articles, sent, failed}"]],
      ["news/tasks.py", "news/templates/email/newsletter.html"],
      ["docker exec -it cnn8jwt_api celery -A news.celery_app call news.tasks.send_newsletter"]],

      ["news/tasks.py", "news/templates/email/stats_report.html"],
      ["docker exec -it cnn8jwt_api python -c \"\\nfrom news.tasks import send_stats_report\\nprint(send_stats_report())\""]],

    redis: ["container", "redis", [
      "One container doing three unrelated jobs, kept apart by database number rather than by hope.",
      "Persistence is off <em>explicitly</em>: the image ships <code>save 3600 1 …</code>, so without <code>--save \"\"</code> a restart reloads a snapshot."
    ], [
      ["image", "redis:7-alpine"], ["port", "6310 → 6379"],
      ["command", "redis-server --save \"\" --appendonly no"],
      ["healthcheck", "redis-cli ping · 2s"]
    ], ["docker-compose.yaml"],
      ["docker compose exec redis redis-cli INFO keyspace"]],

    mailpit: ["container", "mailpit", [
      "Accepts everything, delivers nothing — which is why the app can ship working mail defaults and nothing escapes to a real inbox.",
      "No credentials and no TLS; <code>USE_CREDENTIALS=false</code> is what stops fastapi-mail authenticating.",
      "No <code>--database</code> and no volume: every captured message is lost on restart."
    ], [
      ["ports", "8210 UI · 1010 SMTP"], ["in-network", "mailpit:1025"],
      ["persistence", "none"], ["emails", "3"]
    ], ["news/mail.py", "news/settings.py"],
      ["open http://localhost:8210", "curl -X DELETE http://localhost:8210/api/v1/messages"]],

    pgadmin: ["service", "pgadmin", [
      "The <code>db</code> server arrives preloaded from <code>servers.json</code>, its password from a <code>.pgpass</code> the entrypoint copies on every start.",
      "The copy is not optional: libpq refuses a group-readable password file, and a bind mount keeps the host's mode and uid.",
      "This is where you promote someone — <code>users.role</code> renders as a dropdown, so a typo is impossible."
    ], [["port", "5110 → 80"], ["login", "admin@gmail.com / admin"], ["SERVER_MODE", "False"]],
      ["pgadmin/servers.json", "pgadmin/pgpass"], ["open http://localhost:5110"]],

    flower: ["service", "flower", [
      "Behind <code>profiles: [\"debug\"]</code>, so a plain <code>docker compose up</code> never starts it.",
      "Run from the app's own image, so its Celery client cannot drift from the workers it inspects.",
      "Shows queued, active, retried and failed tasks with arguments and tracebacks — which is how a retry storm becomes visible.",
      "<code>FLOWER_UNAUTHENTICATED_API=1</code> is dev-only: that API exposes task arguments and a shutdown endpoint."
    ], [["profile", "debug"], ["port", "5510"], ["reads", "db 1 + db 2"]],
      ["docker-compose.yaml"],
      ["docker compose --profile debug up -d flower", "curl -s http://localhost:5510/api/workers"]]
  };

  const esc = (s) => s.replace(/&(?![a-z#]+;)/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const ASYNC = new Set(["worker", "beat", "t_newsletter", "t_stats", "db1", "db2", "e_newsletter", "e_stats"]);
  const panel = document.getElementById("panel");

  function render(id) {
    const n = N[id];
    if (!n) return;
    const [kind, name, theses, config, files, cmds] = n;

    panel.innerHTML =
      `<div class="panel-top">
         <span class="kind${ASYNC.has(id) ? " async" : ""}">${kind}</span>
         <h3>${name}</h3>
       </div>
       <section><ul>${theses.map((t) => `<li>${t}</li>`).join("")}</ul></section>
       <section><h4>Configuration</h4>
         <dl>${config.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
       </section>
       <section><h4>Where it lives</h4>
         <div class="files">${files.map((f) => `<code>${esc(f)}</code>`).join("")}</div>
       </section>` +
      (cmds.length ? `<section><h4>Check it</h4><pre>${cmds.map(esc).join("\n")}</pre></section>` : "");

    document.querySelectorAll("[data-node]").forEach((el) => el.classList.toggle("sel", el.dataset.node === id));
    if (window.matchMedia("(max-width: 1080px)").matches) panel.scrollIntoView({ behavior: "smooth", block: "start" });
    panel.scrollTop = 0;
  }

  /* clicking compose sweeps every service it starts */
  let timers = [];

  function sweep() {
    timers.forEach(clearTimeout);
    timers = [];
    const tiles = [...document.querySelectorAll(".svc")];
    tiles.forEach((t) => t.classList.remove("flash"));
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    tiles.forEach((tile, i) => {
      const go = () => { tile.classList.remove("flash"); void tile.getBoundingClientRect(); tile.classList.add("flash"); };
      if (reduce) go(); else timers.push(setTimeout(go, i * 150));
    });
  }

  document.addEventListener("click", (e) => {
    const hit = e.target.closest("[data-node]");
    if (!hit) return;
    render(hit.dataset.node);
    if (hit.dataset.node === "compose") sweep();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const hit = e.target.closest("g[data-node]");
    if (!hit) return;
    e.preventDefault();
    render(hit.dataset.node);
    if (hit.dataset.node === "compose") sweep();
  });

  /* ---- admin gate ----------------------------------------------------
     This page is server-rendered, and this app's auth is a bearer token in
     localStorage rather than a cookie -- so the server cannot know who is
     asking. The check therefore happens here, the same way /liked bounces
     to /login. It is a UI gate: see the route's docstring in pages.py.
  -------------------------------------------------------------------- */
  const gate = document.getElementById("gate");
  const doc = document.getElementById("doc");
  const gateMsg = document.getElementById("gate-msg");
  const gateAct = document.getElementById("gate-action");

  function deny(message, label, href) {
    gateMsg.textContent = message;
    gateAct.textContent = label;
    gateAct.setAttribute("href", href);
    gateAct.hidden = false;
  }

  (async () => {
    let token = null;
    try { token = localStorage.getItem("cnn_token"); } catch { /* storage off */ }

    if (!token) {
      deny("Sign in with an admin account to read the architecture map.", "Sign in", "/login");
      return;
    }

    let me;
    try {
      const res = await fetch("/api/auth/me", { headers: { Authorization: `Bearer ${token}` } });
      if (res.status === 401) {
        deny("That session has expired. Sign in again.", "Sign in", "/login");
        return;
      }
      if (!res.ok) {
        deny(`The API answered ${res.status}. Try again in a moment.`, "Back to CNN Reader", "/");
        return;
      }
      me = await res.json();
    } catch {
      deny("Could not reach the API.", "Back to CNN Reader", "/");
      return;
    }

    if (me.role !== "admin") {
      deny(
        `Signed in as ${me.username}, whose role is "${me.role}". This page needs the admin role.`,
        "Back to CNN Reader",
        "/"
      );
      return;
    }

    gate.hidden = true;
    doc.hidden = false;
    render("compose");
  })();
</script>
</body>
</html>
