# The async FastAPI reader, its database, cache, mail sink, worker and beat.
#
#   docker compose up --build --wait      -> http://localhost:8010/docs
#                                          -> pgAdmin on http://localhost:5110
#
# `name:` is not decoration. Compose derives the project name from the
# directory, and every module in this repo calls that directory "cnn-website"
# -- without this, an `up` here would adopt a sibling module's stack.
#
# Every published port in this file ends in 10, the module number, for the
# same reason: modules 06-11 are all meant to be able to run at once.
name: cnn10

services:
  db:
    image: postgres:15
    container_name: cnn10_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_NAME:-cnn}
    volumes:
      - cnn10_postgres_data:/var/lib/postgresql/data
    # 5410 host-side, following the repo-wide scheme -- module06 takes 5406,
    # module11 5411, so none of them collide. Inside the network: 5432.
    ports:
      - "${DB_PORT:-5410}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-cnn}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  api:
    build: .
    container_name: cnn10_api
    # Brings in NEWS_API_KEY and SECRET_KEY. Gitignored -- copy .env.example first.
    env_file: .env
    environment:
      # `db` is the service name, which is its hostname on the compose network.
      DB_HOST: db
      DB_PORT: 5432
      # Same substitution for mail: `mailpit` is reachable by service name on
      # this network, on its SMTP port rather than the published one. Without
      # these the container would inherit .env's localhost:1010, which inside
      # a container is the container itself.
      MAIL_SERVER: mailpit
      MAIL_PORT: 1025
      # And again for the cache: `redis` by service name, on its in-network
      # port rather than the published 6310.
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Named here rather than left to .env so a shell variable can switch it
      # for one recreate -- `DEBUG=false docker compose up -d api --wait`, which
      # is what the browser suite in tests/e2e needs. It cannot be done from the
      # command line otherwise: `env_file:` outranks the shell, so a prefix on
      # an `up` that resolved DEBUG through .env alone would be ignored.
      DEBUG: ${DEBUG:-true}
    ports:
      - "8010:8000"
    volumes:
      # Bind-mount the source so a save on the host reaches the container --
      # the Dockerfile's `COPY . .` only ever ran once, at image build time.
      # This mount includes the host's .venv/, which is harmless: the
      # container's own venv is at /opt/venv (see the Dockerfile), outside
      # this mount and alone on PATH, so the host's is simply ignored rather
      # than needing an anonymous volume to hide it.
      - .:/app
      # uv's download cache, so the `uv sync` in the command below is a no-op
      # on every start after the first rather than a re-download.
      - cnn10_uv_cache:/opt/uv-cache
    depends_on:
      db:
        condition: service_healthy
      # No condition: service_healthy here -- mail is sent from a background
      # task, so a mailpit that is slow to start delays an email, not a boot.
      mailpit:
        condition: service_started
      # Also not gated on health: a cache that is down is a slow app, not a
      # broken one (see news/cache.py), so there is nothing to wait for.
      redis:
        condition: service_started
    # Dependencies, then migrations, then serve with --reload. `&&` chains
    # them as gates: a failed sync or migration stops the container instead of
    # letting it serve with the wrong packages or against the wrong schema.
    #
    # The `uv sync --frozen` is what keeps the container's packages matching
    # uv.lock without a rebuild. pyproject.toml and uv.lock arrive through the
    # bind mount, so adding a dependency is `uv lock` on the host plus
    # `docker compose restart api` -- no `--build`. --frozen means it installs
    # exactly what the lock pins and errors if the lock is stale rather than
    # quietly resolving something else.
    #
    # --reload-dir scopes the file watcher to the app code, not migrations/.
    command: >
      sh -c "uv sync --frozen --no-install-project &&
      alembic upgrade head &&
      uvicorn news:app --host 0.0.0.0 --port 8000 --reload --reload-dir news"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # The response cache for GET /api/articles/{id}. Everything in here is
  # derived from Postgres and re-fillable, so it is configured to keep
  # nothing.
  redis:
    image: redis:7-alpine
    container_name: cnn10_redis
    # Persistence off, explicitly. The image's default config is NOT a cache
    # config -- it ships `save 3600 1 300 100 60 10000` and writes
    # /data/dump.rdb, so with no volume the snapshot still lives in the
    # container's own filesystem and a `docker compose restart` reloads it
    # ("Done loading RDB, keys loaded: N" in the logs). `--save ""` is what
    # actually turns snapshotting off; --appendonly no is already the default
    # and is spelled out so both mechanisms are visibly accounted for.
    command: redis-server --save "" --appendonly no
    # 6310 published, because 6379 is the port every other Redis on this
    # machine also wants. Inside the network it stays 6379.
    ports:
      - "6310:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # --- the worker -------------------------------------------------------
  #
  # The app's second process type. Everything up to here served requests;
  # these two do work that no request is waiting for.
  #
  # Same image as `api` (`build: .`), same bind mount, same env overrides --
  # the only difference is the command. That is deliberate: a worker that runs
  # a different build from the app it shares a database with is how you get
  # bugs that only appear in the background.
  worker:
    build: .
    container_name: cnn10_worker
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      MAIL_SERVER: mailpit
      MAIL_PORT: 1025
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
      - cnn10_uv_cache:/opt/uv-cache
    depends_on:
      # On `api`, not on `db`. The worker needs the schema to exist, but only
      # one container may run `alembic upgrade head` -- two of them racing the
      # same migration is a deadlock at best. Waiting for a *healthy* api is
      # waiting for the migration the api already ran.
      api:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    # No `alembic upgrade head` here, for the reason in depends_on above.
    #
    # --concurrency=2 with the prefork pool. Each task runs asyncio.run(), so
    # every one gets a fresh event loop; a pooled connection belongs to the loop
    # that opened it, which is why news/cache.py catches RuntimeError ("Event
    # loop is closed") beside RedisError. Drop to `--pool=solo` to take forking
    # out of the picture.
    #
    # Celery has no --reload, unlike the api service: a change to news/tasks.py
    # needs `docker compose restart worker` to be picked up.
    command: >
      sh -c "uv sync --frozen --no-install-project &&
      celery -A news.celery_app worker --loglevel=info --concurrency=2"

  # The scheduler. It sends tasks, it never runs them -- that is the worker's
  # job -- so a stack with a beat and no worker queues jobs forever and
  # delivers nothing.
  beat:
    build: .
    container_name: cnn10_beat
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
      - cnn10_uv_cache:/opt/uv-cache
      # Beat's schedule file records when each entry last fired, so a restart
      # does not immediately re-fire everything. It must NOT live in /app:
      # that is the bind mount, and the file would land in the repository.
      - cnn10_beat_data:/var/lib/celery
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started
    # Exactly one replica, always. Two beats reading the same schedule both
    # fire it, and every reader gets the newsletter twice.
    command: >
      sh -c "uv sync --frozen --no-install-project &&
      celery -A news.celery_app beat --loglevel=info
      --schedule=/var/lib/celery/beat-schedule"

  # Celery's web UI: queued, active, retried and failed tasks, with arguments
  # and tracebacks. Run from this same image rather than the flower image, so
  # its client cannot be a different Celery version from the workers it is
  # inspecting.
  #
  # Opt-in via a profile, like the removed redis-monitor before it -- a
  # monitoring UI is not something to leave listening by default:
  #
  #   docker compose --profile debug up -d flower
  #
  # Then http://localhost:5510. 5555 is Flower's own default and what it
  # listens on inside the container; 5510 is this module's published number.
  flower:
    build: .
    container_name: cnn10_flower
    # The profile is what makes the "opt-in" above true: a service with a
    # profile is skipped by a plain `up` and started only when that profile is
    # named. Without this key the comment would be aspirational and the UI
    # would listen on every run.
    profiles: ["debug"]
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FLOWER_UNAUTHENTICATED_API: "1"
    ports:
      - "5510:5555"
    depends_on:
      redis:
        condition: service_started
    command: >
      sh -c "uv sync --frozen --no-install-project &&
      celery -A news.celery_app flower --port=5555"

  # A dev SMTP sink: accepts everything, delivers nothing, and shows the
  # result at http://localhost:8210. No account and no credentials, which is
  # why settings.py can ship working mail defaults -- and nothing can escape
  # to a real inbox by accident.
  mailpit:
    image: axllent/mailpit
    container_name: cnn10_mailpit
    ports:
      # 8025 the web UI and 1025 the SMTP port the api container talks to,
      # both as mailpit sees them; published here as 8210 and 1010, alongside
      # this stack's 8010 / 5410 / 5110.
      - "8210:8025"
      - "1010:1025"

  pgadmin:
    image: dpage/pgadmin4
    container_name: cnn10_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      # Skips the "enter your master password" prompt on every start. Safe
      # only because SERVER_MODE is False -- this is a single-user desktop-mode
      # pgAdmin on a dev machine, and the master password's whole job is to
      # encrypt *saved* server passwords, which pgpass replaces here.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # Re-import servers.json on every start. Without this the import happens
      # only when pgAdmin first creates its config database, so an edit to
      # servers.json would need the volume deleted rather than a restart.
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "5110:80"
    volumes:
      # Preloads the `db` connection, so there is no "Register → Server…"
      # dialog to fill in by hand.
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      # Copied into place by the entrypoint below, not used from here.
      - ./pgadmin/pgpass:/pgadmin4/pgpass.src:ro
      # Named, so it is visible in `docker volume ls` and removed by
      # `down -v`. The image declares `VOLUME /var/lib/pgadmin`, so without
      # this Compose keeps an *anonymous* volume here and silently carries
      # pgAdmin's config database across `up --force-recreate` -- the same
      # trap that the api service's old /app/.venv volume fell into.
      - cnn10_pgadmin_data:/var/lib/pgadmin
    # The image has a PGPASS_FILE variable that does this copy, but only while
    # initialising a fresh config database -- on every later start it is
    # skipped, so a recreated container with a surviving volume would have no
    # password file. Doing it here instead runs on every start.
    #
    # The copy itself is not optional: libpq refuses a password file that is
    # group- or world-readable, and a bind-mounted file keeps the host's mode
    # and uid (yours, not the container's 5050) -- so mounted in place it
    # could be readable by pgAdmin or acceptable to libpq, never both.
    #
    # Runs as uid 5050, which owns /var/lib/pgadmin, so no root is needed.
    # `exec` keeps pgAdmin as PID 1 so signals still reach it.
    entrypoint: >
      /bin/sh -c "cp /pgadmin4/pgpass.src /var/lib/pgadmin/.pgpass &&
      chmod 600 /var/lib/pgadmin/.pgpass &&
      exec /entrypoint.sh"
    depends_on:
      db:
        condition: service_healthy

volumes:
  cnn10_postgres_data:
  # Named, not anonymous, so it survives `docker compose down` and a rebuild.
  cnn10_uv_cache:
  cnn10_pgadmin_data:
  # Beat's last-run-at file. Named so `down -v` clears it -- which is how you
  # make a schedule fire immediately again instead of waiting out its interval.
  cnn10_beat_data:
