# Trimmed down from `alembic init`: every commented-out option the generator
# emits has been dropped, and every key that remains is one this project needs.
# The full annotated file is in the Alembic documentation.

[alembic]
# Where the migration scripts live. %(here)s is this file's directory, so the
# path holds no matter which directory alembic is invoked from (with -c).
script_location = %(here)s/migrations

# Prepended to sys.path before env.py runs. This is what lets env.py do
# `from news.models import Base` -- without it the project directory is
# not importable and the migration fails on an ImportError.
prepend_sys_path = .

path_separator = os

# Empty on purpose. env.py fills it in from settings.database_url, so the
# database address is written once, in .env, and the app and its migrations
# cannot drift onto different databases. Putting a URL here would also mean a
# password in a file that goes into git.
sqlalchemy.url =


# Logging. Set logger_sqlalchemy to INFO to watch the SQL a migration emits.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
