# The async FastAPI reader, its database, cache, mail sink, worker and beat.
#
#   docker compose up --build --wait      -> http://localhost:8011/docs
#
# Explicit project name: every module's directory is "cnn-website", so without
# it this stack would adopt a sibling module's. Published ports end in 11 (the
# module number) so modules 06-11 can run at once.
name: cnn11

services:
  db:
    image: postgres:15
    container_name: cnn11_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_NAME:-cnn}
    volumes:
      - cnn11_postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5411}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-cnn}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  api:
    build: .
    container_name: cnn11_api
    # NEWS_API_KEY and SECRET_KEY. Gitignored -- copy .env.example first.
    env_file: .env
    # In-network hostnames and ports, overriding .env's localhost values.
    environment:
      DB_HOST: db
      DB_PORT: 5432
      MAIL_SERVER: mailpit
      MAIL_PORT: 1025
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Set here so the shell can override it (`DEBUG=false docker compose up
      # -d api --wait`, for tests/e2e); env_file outranks the shell.
      DEBUG: ${DEBUG:-true}
    ports:
      - "8011:8000"
    volumes:
      # Source bind mount for --reload. The container's venv is /opt/venv,
      # outside this mount.
      - .:/app
      - cnn11_uv_cache:/opt/uv-cache
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_started
    # A new dependency needs `uv lock` on the host + `docker compose restart
    # api`, no rebuild.
    command: >
      sh -c "uv sync --frozen --no-install-project &&
      alembic upgrade head &&
      uvicorn news:app --host 0.0.0.0 --port 8000 --reload --reload-dir news"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: cnn11_redis
    # Pure cache: `--save ""` turns off the image's default RDB snapshots.
    command: redis-server --save "" --appendonly no
    ports:
      - "6311:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  worker:
    build: .
    container_name: cnn11_worker
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      MAIL_SERVER: mailpit
      MAIL_PORT: 1025
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
      - cnn11_uv_cache:/opt/uv-cache
    depends_on:
      # A healthy api means migrations already ran; only the api runs them.
      api:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    # No --reload: a change to news/tasks.py needs `docker compose restart worker`.
    command: >
      sh -c "uv sync --frozen --no-install-project &&
      celery -A news.celery_app worker --loglevel=info --concurrency=2"

  # Exactly one replica: two beats fire every schedule twice.
  beat:
    build: .
    container_name: cnn11_beat
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
      - cnn11_uv_cache:/opt/uv-cache
      # Schedule file kept outside /app so it never lands in the repo.
      - cnn11_beat_data:/var/lib/celery
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "uv sync --frozen --no-install-project &&
      celery -A news.celery_app beat --loglevel=info
      --schedule=/var/lib/celery/beat-schedule"

  # Opt-in: `docker compose --profile debug up -d flower` -> http://localhost:5511
  flower:
    build: .
    container_name: cnn11_flower
    profiles: ["debug"]
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FLOWER_UNAUTHENTICATED_API: "1"
    ports:
      - "5511:5555"
    depends_on:
      redis:
        condition: service_started
    command: >
      sh -c "uv sync --frozen --no-install-project &&
      celery -A news.celery_app flower --port=5555"

  # Dev SMTP sink, UI at http://localhost:8211. Nothing reaches a real inbox.
  mailpit:
    image: axllent/mailpit
    container_name: cnn11_mailpit
    ports:
      - "8211:8025"
      - "1011:1025"

  # http://localhost:5111, with the `db` connection preloaded.
  pgadmin:
    image: dpage/pgadmin4
    container_name: cnn11_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "5111:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass.src:ro
      - cnn11_pgadmin_data:/var/lib/pgadmin
    # libpq rejects a pgpass that isn't mode 600 and owned by the container
    # user, which a bind mount can't guarantee -- so copy it on every start.
    entrypoint: >
      /bin/sh -c "cp /pgadmin4/pgpass.src /var/lib/pgadmin/.pgpass &&
      chmod 600 /var/lib/pgadmin/.pgpass &&
      exec /entrypoint.sh"
    depends_on:
      db:
        condition: service_healthy

volumes:
  cnn11_postgres_data:
  cnn11_uv_cache:
  cnn11_pgadmin_data:
  cnn11_beat_data:
