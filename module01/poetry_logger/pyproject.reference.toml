# ДОВІДКОВИЙ ФАЙЛ — не використовується для збірки.
#
# Робочий маніфест проєкту — це pyproject.toml поруч. Тут зібрано майже все,
# що взагалі можна написати в pyproject.toml, з поясненнями. Читати як шпаргалку,
# а не копіювати цілком: реальний маніфест майже ніколи не містить і чверті цього.
#
# Перевірити валідність:
#   mkdir -p /tmp/ref && cp pyproject.reference.toml /tmp/ref/pyproject.toml
#   cd /tmp/ref && touch README.md && poetry check


# ════════════════════════════════════════════════════════════════════════
#  [project] — СТАНДАРТ PEP 621
#  Цей блок читають Poetry, uv, pip, hatch, setuptools, pdm. Він переносний.
# ════════════════════════════════════════════════════════════════════════
[project]
name = "statusboard"
version = "0.1.0"
description = "Uptime board for public sites"
readme = "README.md"

# Мінімальна версія Python. uv за цим рядком уміє САМ завантажити потрібний
# інтерпретатор; Poetry — ні, він лише перевірить наявний.
requires-python = ">=3.12,<4.0"

# PEP 639: рядок з SPDX-ідентифікатором. Старий синтаксис { text = "MIT" }
# і { file = "LICENSE" } вважається застарілим.
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Oleh Andrus", email = "oleh@example.com" },
]
maintainers = [
    { name = "Course Team", email = "team@example.com" },
]

# Для пошуку на PyPI.
keywords = ["monitoring", "uptime", "flask", "status-page"]

# Список дозволених значень — https://pypi.org/classifiers/
# Довільний рядок сюди писати не можна: PyPI відхилить завантаження.
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Private :: Do Not Upload",   # запобіжник: PyPI відмовиться приймати пакет
]

# ── Робочі залежності ───────────────────────────────────────────────────
dependencies = [
    # Звичайний діапазон, PEP 508.
    "flask>=3.1.0,<4.0.0",

    # Extras пакета: requests[socks] додатково тягне PySocks.
    "requests[socks]>=2.32.3,<3.0.0",

    # Маркери оточення: ставиться ЛИШЕ там, де умова істинна.
    # Найчастіші маркери: python_version, sys_platform, platform_machine,
    # implementation_name, os_name.
    "tomli>=2.0; python_version < '3.11'",
    "colorama>=0.4.6; sys_platform == 'win32'",
    "uvloop>=0.19; sys_platform != 'win32' and platform_python_implementation == 'CPython'",

    # Комбінація extras + маркер.
    "psycopg[binary]>=3.2; sys_platform == 'linux'",

    # Пряме посилання (PEP 440 direct reference). PyPI такі пакети НЕ приймає —
    # тільки для внутрішніх проєктів.
    # "internal-lib @ git+ssh://git@github.com/acme/internal-lib.git@v1.2.0",
    # "vendored @ file:///${PROJECT_ROOT}/vendor/vendored-1.0-py3-none-any.whl",
]

# ── Extras: необов'язкові набори для КОРИСТУВАЧА пакета ─────────────────
# Встановлюються як `pip install statusboard[postgres]`.
# Не плутати з групами залежностей: extras їдуть у зібраний пакет і видні
# споживачам, групи — ні, вони суто для розробки.
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
redis = ["redis>=5.0"]
all = ["statusboard[postgres,redis]"]     # extra, що вмикає інші extras

# ── Посилання, які PyPI показує збоку на сторінці пакета ───────────────
[project.urls]
Homepage = "https://example.com/statusboard"
Documentation = "https://example.com/statusboard/docs"
Repository = "https://github.com/acme/statusboard"
Issues = "https://github.com/acme/statusboard/issues"
Changelog = "https://github.com/acme/statusboard/blob/main/CHANGELOG.md"

# ── Консольні команди ───────────────────────────────────────────────────
# Після встановлення в PATH з'явиться виконуваний файл `statusboard`,
# який викличе функцію main() з модуля statusboard.cli.
[project.scripts]
statusboard = "statusboard.cli:main"

# Те саме, але без консольного вікна на Windows (для GUI-застосунків).
[project.gui-scripts]
statusboard-gui = "statusboard.gui:main"

# ── Точки розширення (плагіни) ──────────────────────────────────────────
# Так інші пакети знаходять ваш код. Приклад: pytest шукає плагіни в групі
# "pytest11", flake8 — у "flake8.extension".
[project.entry-points."statusboard.probes"]
http = "statusboard.probes.http:HttpProbe"
tcp = "statusboard.probes.tcp:TcpProbe"

[project.entry-points."pytest11"]
statusboard = "statusboard.pytest_plugin"

# ── Поля, які обчислює build-backend, а не людина ───────────────────────
# Найчастіше так роблять з version, щоб вона бралася з __init__.py або з git-тега.
# Поле, вказане тут, НЕ можна одночасно задати вище статично.
# dynamic = ["version"]


# ════════════════════════════════════════════════════════════════════════
#  [tool.poetry] — те, чого немає в стандарті
# ════════════════════════════════════════════════════════════════════════
[tool.poetry]
# false → Poetry лише керує середовищем і нічого не збирає (застосунки).
# true (за замовчуванням) → потрібні packages, build-system, src-розкладка.
package-mode = true

# Що саме класти у wheel. from = "src" — рекомендована src-розкладка.
packages = [
    { include = "statusboard", from = "src" },
    { include = "statusboard_plugins", from = "src", to = "statusboard" },
]

# Додаткові файли у збірку. format обмежує, куди саме: sdist, wheel або обидва.
include = [
    { path = "src/statusboard/py.typed", format = ["sdist", "wheel"] },
    { path = "tests", format = "sdist" },      # тести — лише в sdist
    { path = "CHANGELOG.md", format = "sdist" },
]
exclude = ["src/statusboard/_scratch.py"]

# Мінімальна версія самого Poetry та потрібні плагіни. Poetry перевірить це
# перед роботою й скаже, чого бракує.
requires-poetry = ">=2.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

# ── Приватний індекс ────────────────────────────────────────────────────
# priority:
#   primary     — шукати тут, потім у PyPI
#   supplemental— тільки якщо в основних не знайдено
#   explicit    — лише для пакетів, які ЯВНО вказали цей source
[[tool.poetry.source]]
name = "acme-internal"
url = "https://pypi.acme.internal/simple/"
priority = "supplemental"

[[tool.poetry.source]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

# ── Уточнення до залежностей, оголошених у [project] ───────────────────
# Тут дозволено те, чого PEP 621 не вміє: прив'язка до конкретного індексу,
# встановлення в editable-режимі, гілки git.
[tool.poetry.dependencies]
torch = { source = "torch-cpu" }
internal-lib = { git = "https://github.com/acme/internal-lib.git", branch = "main" }
# develop = true — editable-режим: зміни в сусідній теці видно одразу, без
# перевстановлення. На цьому рядку `poetry check` попередить, що шляху не існує:
# так і має бути, це вигаданий приклад.
shared-utils = { path = "../shared-utils", develop = true }

# ── Групи залежностей ───────────────────────────────────────────────────
# Головна відмінність від extras: групи НЕ потрапляють у зібраний пакет.
# Це інструменти розробника, а не можливості продукту.
[tool.poetry.group.dev.dependencies]
ruff = "^0.14.0"
pytest = "^8.3"
pytest-cov = "^6.0"

# optional = true → група не ставиться без явного --with docs
[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6"
mkdocs-material = "^9.5"

[tool.poetry.group.typing.dependencies]
mypy = "^1.13"
types-requests = "^2.32"

# poetry install                     → main + dev + typing
# poetry install --with docs         → і docs теж
# poetry install --only main         → тільки робочі
# poetry install --without dev       → усе, крім dev
# poetry sync --only main            → тільки робочі, решту ВИДАЛИТИ


# ════════════════════════════════════════════════════════════════════════
#  Синтаксис версій у Poetry
# ════════════════════════════════════════════════════════════════════════
#   ^1.2.3   >=1.2.3, <2.0.0     caret — не ламати мажорну
#   ^0.2.3   >=0.2.3, <0.3.0     для 0.x мажорною вважається друга цифра
#   ~1.2.3   >=1.2.3, <1.3.0     tilde — лише патчі
#   ~1.2     >=1.2.0, <1.3.0
#   1.2.*    >=1.2.0, <1.3.0     wildcard
#   >=1.2,<2 явний діапазон (єдиний, що зрозуміє будь-який інструмент)
#   ==1.2.3  точна версія
#   !=1.2.4  виключити зламаний реліз
#   *        будь-яка


# ════════════════════════════════════════════════════════════════════════
#  [build-system] — ЧИМ збирати пакет
#  Обов'язковий для бібліотек. Для застосунків з package-mode = false —
#  не потрібен взагалі.
# ════════════════════════════════════════════════════════════════════════
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Альтернативи, які трапляються найчастіше:
#   hatchling      → requires = ["hatchling"],   backend = "hatchling.build"
#   setuptools     → requires = ["setuptools>=68"], backend = "setuptools.build_meta"
#   flit           → requires = ["flit_core>=3.9"], backend = "flit_core.buildapi"
#   maturin (Rust) → requires = ["maturin>=1.7"],  backend = "maturin"
#   uv_build       → requires = ["uv_build>=0.9"], backend = "uv_build"


# ════════════════════════════════════════════════════════════════════════
#  ЩО ТУТ ЖИВЕ В uv (для порівняння)
# ════════════════════════════════════════════════════════════════════════
# [dependency-groups]                      ← PEP 735, стандарт замість
# dev = ["ruff>=0.14", "pytest>=8.3"]         [tool.poetry.group.*]
# docs = ["mkdocs>=1.6"]
#
# [tool.uv]
# default-groups = ["dev"]                 # які групи ставити без прапорців
# package = false                          # аналог package-mode = false
# python-preference = "only-managed"       # ігнорувати системні Python
# required-version = ">=0.9"
#
# [tool.uv.sources]                        # аналог [tool.poetry.dependencies]
# torch = { index = "torch-cpu" }
# internal-lib = { git = "https://...", branch = "main" }
# shared-utils = { path = "../shared-utils", editable = true }
#
# [[tool.uv.index]]
# name = "torch-cpu"
# url = "https://download.pytorch.org/whl/cpu"
# explicit = true
#
# [tool.uv.workspace]                      # монорепа з кількох пакетів
# members = ["packages/*"]


# ════════════════════════════════════════════════════════════════════════
#  ІНШІ ІНСТРУМЕНТИ В ЦЬОМУ Ж ФАЙЛІ
#  pyproject.toml — спільна конфігурація для всього тулінгу. Саме тому
#  зникли setup.cfg, .flake8, pytest.ini, .isort.cfg і решта зоопарку.
# ════════════════════════════════════════════════════════════════════════
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]          # assert у тестах — це нормально

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: тести, які ходять у мережу",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["some_untyped_lib.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
