# pre-commit runs the same three tools that pyproject.toml configures — ruff,
# bandit and mypy — on `git commit`, against staged files only.
#
#   uv run pre-commit install                 # wire into .git/hooks (once)
#   uv run pre-commit run --all-files         # run over everything now
#   uv run pre-commit autoupdate              # bump the `rev:` pins below
#   uv run pre-commit run ruff-check          # one hook only
#
# Hooks install per GIT REPOSITORY, not per folder, and this repo holds several
# projects. From the repository root, point at this file explicitly:
#
#   pre-commit run --config module01/tools/.pre-commit-config.yaml --all-files
#
# `--all-files` means "every file git knows about". While this folder is still
# untracked you will get `(no files to check) Skipped` from every hook — that
# is not a broken config, it just means `git add` has not happened yet.

files: ^module01/tools/
# The three demo folders are broken on purpose: `ruff --fix` would repair
# exactly what messy.py exists to show, and mypy would fail every commit with
# broken.py's 46 errors.
exclude: ^module01/tools/(bandit_demo|mypy_demo|ruff_demo|\.venv)/

repos:
  # ruff — linter and formatter. Rules live in [tool.ruff] in pyproject.toml,
  # which ruff finds on its own; no --config needed.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # NOTE: this hook was called `ruff` before v0.12. Old configs will not
      # work against a current rev, and the error message is unhelpful.
      - id: ruff-check
        # --exit-non-zero-on-fix matters: with a bare --fix, ruff repairs
        # the file and exits 0, so the commit goes through and you never
        # notice your source was rewritten.
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # bandit — security scanner. Unlike ruff and mypy it does NOT read
  # pyproject.toml by itself, so -c is mandatory; without it bandit would
  # scan .venv too and report hundreds of findings in other people's code.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, module01/tools/pyproject.toml]
        # assert in tests is normal; bandit reports it as B101.
        exclude: ^module01/tools/tests/

  # mypy — static type checking.
  #
  # The trap: pre-commit builds each hook its OWN virtualenv and knows nothing
  # about uv or Poetry. That mypy cannot see flask or types-requests, so every
  # `import flask` is unresolved and all Flask types collapse to Any. Third-
  # party packages have to be listed by hand here — and this list does not stay
  # in step with pyproject.toml on its own.
  #
  # Many teams skip the mypy hook for exactly this reason and run it in CI
  # instead, where the environment is the real one: `uv sync && uv run mypy`.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        additional_dependencies: [flask==3.1.3, types-requests==2.33.0.20260712]
        # Mandatory for the same reason as bandit's -c: the hook runs from the
        # REPOSITORY root, not from this folder. pre-commit passes the file
        # paths itself, so `files` in [tool.mypy] is unused in this mode.
        args: [--config-file, module01/tools/pyproject.toml]
        exclude: ^module01/tools/tests/
