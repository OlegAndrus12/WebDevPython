name: cnn06

#   docker compose up --build --wait   app on http://localhost:8080
services:
  db:
    image: postgres:15
    container_name: cnn06_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_NAME:-cnn}
    volumes:
      - cnn06_postgres_data:/var/lib/postgresql/data
    # 5433 on the host, not 5432, to stay clear of a local Postgres. Inside
    # the compose network the port is still 5432 -- this only remaps the host.
    ports:
      - "${DB_PORT:-5433}:5432"
    # `depends_on: condition: service_healthy` below is only meaningful because
    # of this block. Postgres accepts TCP connections seconds before it will
    # accept queries, so waiting on the port alone is not enough.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-cnn}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  web:
    build: .
    container_name: cnn06_web
    # Brings in NEWS_API_KEY. The file is gitignored -- copy .env.example first.
    env_file: .env
    environment:
      # Overrides the host-side defaults from .env. `db` is the service name,
      # which is also its hostname on the compose network, and the port is the
      # container's own 5432 rather than whatever is published outside.
      # DB_USER / DB_PASSWORD / DB_NAME come through env_file unchanged.
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Bind-mount the source so a save on the host reaches the container --
      # the Dockerfile's `COPY . .` only ever ran once, at image build time.
      # The venv is at /opt/venv (see the Dockerfile), out of the mount's way.
      - .:/app
      # uv's download cache, so the `uv sync` in the command below is a no-op
      # on every start after the first rather than a re-download.
      - cnn06_uv_cache:/opt/uv-cache
    command: >
      sh -c "uv sync --frozen --no-install-project &&
      alembic upgrade head &&
      flask --app cnn_website run --host 0.0.0.0 --port 8000 --debug"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    container_name: cnn06_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      # Skips the "enter your master password" prompt on every start.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # Re-import servers.json on every start.
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "5050:80"
    volumes:
      # Preloads the `db` connection, so there is no "Register -> Server..."
      # dialog to fill in by hand.
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      # Copied into place by the entrypoint below, not used from here.
      - ./pgadmin/pgpass:/pgadmin4/pgpass.src:ro
      # Named, so it is visible in `docker volume ls` and removed by
      # `down -v`.
      - cnn06_pgadmin_data:/var/lib/pgadmin
    entrypoint: >
      /bin/sh -c "cp /pgadmin4/pgpass.src /var/lib/pgadmin/.pgpass &&
      chmod 600 /var/lib/pgadmin/.pgpass &&
      exec /entrypoint.sh"
    depends_on:
      db:
        condition: service_healthy

volumes:
  cnn06_postgres_data:
  # Named, not anonymous, so it survives `docker compose down` and a rebuild.
  cnn06_uv_cache:
  cnn06_pgadmin_data:
