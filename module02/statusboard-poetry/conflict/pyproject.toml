# A deliberately unsatisfiable project — see the README section
# "Конфлікт залежностей".
#
# This is a project of its own, in its own folder, precisely so that the
# statusboard pyproject.toml and poetry.lock one level up are never touched.
# Poetry is pointed at it explicitly:
#
#     poetry -C conflict lock
#
# Flask 3.1.0 declares Werkzeug>=3.1, so pinning Werkzeug to 2.3.0 beside it
# asks for a combination that does not exist. Poetry refuses to write a lock
# file and explains which two requirements collide.
#
# Turn it into a *solvable* conflict by relaxing the flask pin to "*": Poetry
# then backtracks to Flask 2.3.1, the newest release that still accepts
# Werkzeug 2.3.0, and writes a perfectly valid lock file.

[project]
name = "conflict-demo"
version = "0.1.0"
description = "Two requirements that cannot both be satisfied"
requires-python = ">=3.12"
dependencies = [
    "flask (==3.1.0)",
    "werkzeug (==2.3.0)",
]

[tool.poetry]
package-mode = false
